[phases.setup]
nixPkgs = ["python311"]

[phases.install]
cmds = [
    "python -m venv .venv",
    ". .venv/bin/activate && pip install --upgrade pip",
    ". .venv/bin/activate && pip install -r requirements.txt"
]

[phases.start]
cmd = ". .venv/bin/activate && python bot.py"

[start]
processes = [". .venv/bin/activate && python bot.py"]